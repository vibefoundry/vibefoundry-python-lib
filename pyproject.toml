[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibefoundry"
version = "0.4.6"
description = "A local IDE for data science workflows with script running and metadata generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "VibeFoundry"}
]
keywords = ["ide", "data-science", "scripts", "codespace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "polars-lts-cpu>=1.0.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    # polars.read_excel needs a reader backend; without it every .xlsx failed
    # to open with "required package 'fastexcel' not found".
    "fastexcel>=0.10",
    # Renders a worksheet to HTML keeping fills, fonts, borders and merges —
    # the styling a dataframe view discards.
    "xlsx2html>=0.6",
    "websockets>=11.0.0",
    "httpx>=0.25.0",
    "xlsx2csv>=0.8.0",
    "python-multipart>=0.0.6",
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.0",
    "truststore>=0.9; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.scripts]
vibefoundry = "vibefoundry.cli:main"

[project.urls]
Homepage = "https://vibefoundry.ai"
Repository = "https://github.com/vibefoundry/vibefoundry-python-lib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibefoundry = ["static/**/*", "pane/*.html"]
